openapi: 3.0.3
info:
  title: ERP Lite API
  description: API REST do sistema ERP Lite para varejo alimentar
  version: 1.0.0
  contact:
    email: suporte@erplite.com.br
  license:
    name: MIT

servers:
  - url: http://localhost:3001/api/v1
    description: Desenvolvimento
  - url: https://api.erplite.com.br/v1
    description: Produção

tags:
  - name: Auth
    description: Autenticação e autorização
  - name: Products
    description: Gestão de produtos
  - name: Sales
    description: Vendas
  - name: Stock
    description: Controle de estoque
  - name: Customers
    description: Clientes
  - name: Suppliers
    description: Fornecedores
  - name: Finance
    description: Financeiro
  - name: PDV
    description: Integração com PDV Python
  - name: Sync
    description: Sincronização

paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Realizar login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Login realizado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
                      tokens:
                        $ref: '#/components/schemas/Tokens'
        '401':
          description: Credenciais inválidas

  /products:
    get:
      tags: [Products]
      summary: Listar produtos
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Lista de produtos
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
    
    post:
      tags: [Products]
      summary: Criar produto
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '201':
          description: Produto criado
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Product'

  /products/{id}:
    get:
      tags: [Products]
      summary: Obter produto
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Produto encontrado
        '404':
          description: Produto não encontrado

  /pdv/sales:
    post:
      tags: [PDV]
      summary: Enviar venda do PDV (idempotente)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PDVSale'
      responses:
        '201':
          description: Venda registrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      sale:
                        $ref: '#/components/schemas/Sale'
                      duplicated:
                        type: boolean
                        description: true se a venda já existia (idempotente)

  /pdv/products/changes:
    get:
      tags: [PDV]
      summary: Obter alterações de produtos desde uma data
      security:
        - bearerAuth: []
      parameters:
        - name: since
          in: query
          required: true
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Alterações encontradas
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      updated:
                        type: array
                        items:
                          $ref: '#/components/schemas/Product'
                      deleted:
                        type: array
                        items:
                          type: string
                      serverTime:
                        type: string
                        format: date-time

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [admin, manager, operator, viewer]
        permissions:
          type: array
          items:
            type: string

    Tokens:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer

    Product:
      type: object
      properties:
        id:
          type: string
        code:
          type: string
        barcode:
          type: string
        description:
          type: string
        shortDescription:
          type: string
        categoryId:
          type: string
        unit:
          type: string
        costPrice:
          type: number
        salePrice:
          type: number
        margin:
          type: number
        minStock:
          type: integer
        currentStock:
          type: number
        isWeighable:
          type: boolean
        status:
          type: string
          enum: [ACTIVE, INACTIVE]

    ProductInput:
      type: object
      required: [code, description, unit, costPrice, salePrice]
      properties:
        code:
          type: string
        barcode:
          type: string
        description:
          type: string
        shortDescription:
          type: string
        categoryId:
          type: string
        unit:
          type: string
          enum: [UN, KG, G, L, ML, CX, PCT, FD]
        ncm:
          type: string
        costPrice:
          type: number
        salePrice:
          type: number
        minStock:
          type: integer
        isWeighable:
          type: boolean

    Sale:
      type: object
      properties:
        id:
          type: string
        saleId:
          type: string
        storeId:
          type: string
        terminalId:
          type: string
        operatorId:
          type: string
        date:
          type: string
          format: date-time
        total:
          type: number
        status:
          type: string
          enum: [COMPLETED, CANCELLED]

    PDVSale:
      type: object
      required: [saleId, terminalId, operatorId, date, items, payments, total, idempotencyKey]
      properties:
        saleId:
          type: string
          format: uuid
        terminalId:
          type: string
        operatorId:
          type: string
        date:
          type: string
          format: date-time
        customerId:
          type: string
          nullable: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/PDVSaleItem'
        payments:
          type: array
          items:
            $ref: '#/components/schemas/PDVPayment'
        subtotal:
          type: number
        discount:
          type: number
        total:
          type: number
        idempotencyKey:
          type: string
          format: uuid

    PDVSaleItem:
      type: object
      properties:
        productId:
          type: string
        barcode:
          type: string
        description:
          type: string
        quantity:
          type: number
        unitPrice:
          type: number
        discount:
          type: number
        total:
          type: number
        isWeighable:
          type: boolean
        weight:
          type: number

    PDVPayment:
      type: object
      properties:
        type:
          type: string
          enum: [DINHEIRO, PIX, DEBITO, CREDITO, VALE, OUTROS]
        amount:
          type: number
        reference:
          type: string

    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
